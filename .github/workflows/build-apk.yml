name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'runtime/**'
      - 'android-app/**'
      - 'build/**'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  NDK_VERSION: r26d
  ANDROID_API_LEVEL: 30
  RUST_TARGET: aarch64-linux-android

jobs:
  build-rust-native:
    runs-on: ubuntu-latest
    outputs:
      rust-version: ${{ steps.rust-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('runtime/Cargo.lock', 'runtime/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Android NDK
        run: |
          NDK_ZIP="android-ndk-${NDK_VERSION}-linux.zip"
          wget -q "https://dl.google.com/android/repository/${NDK_ZIP}"
          unzip -q "$NDK_ZIP" -d /tmp/
          rm "$NDK_ZIP"
          echo "ANDROID_NDK_HOME=/tmp/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV

      - name: Configure NDK linker
        run: |
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          echo "CC_${RUST_TARGET//-/_}=${TOOLCHAIN}/bin/${RUST_TARGET}${ANDROID_API_LEVEL}-clang" >> $GITHUB_ENV
          echo "AR_${RUST_TARGET//-/_}=${TOOLCHAIN}/bin/llvm-ar" >> $GITHUB_ENV
          echo "CARGO_TARGET_${RUST_TARGET^^}_LINKER=${TOOLCHAIN}/bin/${RUST_TARGET}${ANDROID_API_LEVEL}-clang" >> $GITHUB_ENV

      - name: Build Rust runtime (release)
        run: cargo build --release --target ${{ env.RUST_TARGET }}
        working-directory: runtime

      - name: Verify shared library
        run: file "runtime/target/${{ env.RUST_TARGET }}/release/libastrashell.so"

      - name: Upload Rust library
        uses: actions/upload-artifact@v4
        with:
          name: libastrashell-so
          path: runtime/target/${{ env.RUST_TARGET }}/release/libastrashell.so
          retention-days: 1

  build-apk:
    runs-on: ubuntu-latest
    needs: build-rust-native
    strategy:
      matrix:
        build-type: [debug, release]
        include:
          - build-type: debug
            gradle-task: assembleDebug
            signing: false
            artifact-name: astrashell-debug
          - build-type: release
            gradle-task: assembleRelease
            signing: true
            artifact-name: astrashell-release

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android SDK components
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1" \
            --sdk_root=$ANDROID_HOME || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android-app/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android-app/**/*.gradle*', 'android-app/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Download Rust library
        uses: actions/download-artifact@v4
        with:
          name: libastrashell-so
          path: android-app/app/src/main/jniLibs/arm64-v8a/

      - name: Verify JNI libraries
        run: |
          ls -la android-app/app/src/main/jniLibs/arm64-v8a/
          file android-app/app/src/main/jniLibs/arm64-v8a/libastrashell.so

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" >> android-app/local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/26.1.10909125" >> android-app/local.properties

      - name: Build APK
        run: ./gradlew ${{ matrix.gradle-task }}
        working-directory: android-app
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125

      - name: Sign release APK (if available)
        if: matrix.signing
        run: |
          if [ -f android-app/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            # Signing would use keystore from GitHub secrets
            echo "Release signing requires KEYSTORE_BASE64 secret"
          fi

      - name: Rename APK
        run: |
          apk_dir="android-app/app/build/outputs/apk/${{ matrix.build-type }}"
          version=$(grep 'versionName' android-app/app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/' || echo "0.1.0")
          commit=$(echo ${{ github.sha }} | cut -c1-7)
          for apk in "$apk_dir"/*.apk; do
            if [ -f "$apk" ]; then
              ext="${apk##*.}"
              mv "$apk" "$apk_dir/astrashell-${version}-${commit}-${{ matrix.build-type }}.${ext}"
            fi
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}-${{ github.sha }}
          path: android-app/app/build/outputs/apk/${{ matrix.build-type }}/*.apk
          compression-level: 0
          retention-days: 30

      - name: Upload mapping (release only)
        if: matrix.signing
        uses: actions/upload-artifact@v4
        with:
          name: astrashell-mapping-${{ github.sha }}
          path: android-app/app/build/outputs/mapping/release/mapping.txt
          retention-days: 30

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build-apk
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate release notes
        id: release-notes
        run: |
          echo "## AstraShell ${{ github.ref_name }}" > /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "### Downloads" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          ls release-artifacts/ >> /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AstraShell ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
          draft: true
          prerelease: false
          files: |
            release-artifacts/**/*.apk
            release-artifacts/**/*.txt
          fail_on_unmatched_files: false
