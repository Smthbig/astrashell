name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  lint-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-linux-android
          components: clippy, rustfmt
      - run: cargo clippy -- -D warnings
        working-directory: runtime
      - run: cargo fmt --check
        working-directory: runtime

  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-linux-android
      - run: cargo test
        working-directory: runtime

  build-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-linux-android
      - name: Setup NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
      - name: Build Rust
        run: cargo build --release --target aarch64-linux-android
        working-directory: runtime

  build-android:
    runs-on: ubuntu-latest
    needs: build-rust
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build APK
        run: ./gradlew assembleDebug
        working-directory: android-app
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: astrashell-debug
          path: android-app/app/build/outputs/apk/debug/*.apk

  rootfs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build rootfs
        run: bash build/scripts/gen-rootfs.sh /tmp/rootfs
      - name: Upload rootfs
        uses: actions/upload-artifact@v3
        with:
          name: astrashell-arch-rootfs
          path: /tmp/astrashell-arch-rootfs.tar.gz
