[package]
name = "astrashell-runtime"
version = "0.1.0"
edition = "2021"
description = "AstraShell - Next-generation Android Linux runtime platform"

[lib]
name = "astrashell"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "astrashelld"
path = "src/main.rs"

[features]
default = ["native-engine", "container-engine"]
native-engine = []
container-engine = ["nix", "caps"]
vm-engine = []
avf = []
gui = []
gpu = []

[dependencies]
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
toml = "0.8"
rmp-serde = "1.1"
nix = { version = "0.27", optional = true }
caps = { version = "0.5", optional = true }
libc = "0.2"
errno = "0.3"
tracing = { version = "0.1", features = ["max_level_debug", "release_max_level_info"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
log = "0.4"
clap = { version = "4.4", features = ["derive", "env"] }
goblin = "0.8"
flate2 = "1.0"
tar = "0.4"
xz2 = "0.1"
zstd = "0.13"
sha2 = "0.10"
rand = "0.8"
thiserror = "1.0"
anyhow = "1.0"
signal-hook = "0.3"
mimalloc = { version = "0.1", features = ["secure"] }

# Optional / platform-specific
vsock = { version = "0.4", optional = true }
axum = { version = "0.7", features = ["ws"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
